<div class="settings-container">
  <h1>Profil utilisateur</h1>

  <section class="settings-section card">
    <div class="section-title">
      <i class="pi pi-user"></i> <h3>Informations</h3>
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Nom complet</label>
        <input type="text" [(ngModel)]="profile.fullName">
      </div>
      <div class="form-group">
        <label>Role</label>
        <input type="text" [value]="profile.roleLabel" readonly>
      </div>
    </div>
    <div class="form-group">
      <label>Email</label>
      <input type="email" [(ngModel)]="profile.email">
    </div>
    <div class="form-group">
      <label>Telephone</label>
      <input type="tel" [(ngModel)]="profile.phone">
    </div>
    <div class="form-group">
      <label>Structure</label>
      <input type="text" [(ngModel)]="profile.company">
    </div>
    <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>
    <button class="btn-primary" (click)="saveProfile()">Sauvegarder les modifications</button>
  </section>

  <section class="settings-section card mt-20">
    <div class="section-title">
      <i class="pi pi-bell"></i> <h3>Notifications</h3>
    </div>
    <div class="toggle-item">
      <div class="toggle-text">
        <strong>Notifications par email</strong>
        <span>Recevoir les mises a jour des projets par email</span>
      </div>
      <input type="checkbox" [(ngModel)]="profile.emailNotifications">
    </div>
    <div class="toggle-item">
      <div class="toggle-text">
        <strong>Notifications push</strong>
        <span>Recevoir les alertes dans le navigateur</span>
      </div>
      <input type="checkbox" [(ngModel)]="profile.pushNotifications">
    </div>
    <div class="toggle-item">
      <div class="toggle-text">
        <strong>Resume hebdomadaire</strong>
        <span>Recevoir un recapitulatif sur l avancement 2D et 3D</span>
      </div>
      <input type="checkbox" [(ngModel)]="profile.weeklySummary">
    </div>
  </section>
</div>
