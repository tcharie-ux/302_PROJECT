<div class="modal-form-container">
  <div class="form-card">
    <h2>Creer un nouveau projet</h2>

    <form class="project-form" (ngSubmit)="submitForm()">
      <div class="form-group">
        <label>Nom du projet</label>
        <input type="text" name="name" placeholder="Ex: Maison familiale" [(ngModel)]="projectDraft.name">
      </div>

      <div class="form-group">
        <label>Localisation</label>
        <input type="text" name="location" placeholder="Ex: Lome, Togo" [(ngModel)]="projectDraft.location">
      </div>

      <div class="form-group">
        <label>Email architecte (optionnel)</label>
        <input
          type="email"
          name="architectEmail"
          placeholder="architecte@example.com"
          [(ngModel)]="projectDraft.architectEmail"
        >
      </div>

      <div class="form-group">
        <label>Type de batiment</label>
        <div class="radio-group">
          <label class="radio-item">
            <input type="radio" name="buildingType" value="maison" [(ngModel)]="projectDraft.buildingType">
            <span>Maison</span>
          </label>
          <label class="radio-item">
            <input type="radio" name="buildingType" value="immeuble" [(ngModel)]="projectDraft.buildingType">
            <span>Immeuble</span>
          </label>
        </div>
      </div>

      <div class="dimensions-grid">
        <div class="form-group">
          <label>Longueur (m)</label>
          <input type="number" name="length" [(ngModel)]="projectDraft.length">
        </div>
        <div class="form-group">
          <label>Largeur (m)</label>
          <input type="number" name="width" [(ngModel)]="projectDraft.width">
        </div>
        <div class="form-group">
          <label>Hauteur (m)</label>
          <input type="number" name="height" [(ngModel)]="projectDraft.height">
        </div>
        <div class="form-group">
          <label>Niveaux</label>
          <input type="number" name="floors" [(ngModel)]="projectDraft.floors">
        </div>
      </div>

      <p class="success-message" *ngIf="successMessage">{{ successMessage }}</p>

      <div class="form-actions">
        <button type="submit" class="btn-submit">Valider la configuration</button>
        <button type="button" class="btn-cancel" (click)="cancel()">Annuler</button>
      </div>
    </form>
  </div>
</div>
